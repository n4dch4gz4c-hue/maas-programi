<style>
:root {
  --primary: #1F4E79;
  --secondary: #C65911;
  --bg: #f0f2f5;
  --card: #ffffff;
  --input: #fffbf0;
  --formula: #e8f5e9;
  --border: #e0e0e0;
  --text: #2c3e50;
  --hover: #f8f9fa;
}
* { box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, #f0f2f5 0%, #e8eef5 100%);
  margin: 0;
  padding: 16px;
  color: var(--text);
  min-height: 100vh;
}
.header {
  background: linear-gradient(135deg, var(--primary) 0%, #2a6cb0 100%);
  color: white;
  padding: 24px 32px;
  border-radius: 16px;
  margin-bottom: 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 4px 20px rgba(31,78,121,0.15);
}
.header h1 { margin: 0; font-size: 26px; font-weight: 700; }
.header p { margin: 6px 0 0; opacity: 0.9; font-size: 14px; }
.controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 20px;
  align-items: center;
  background: white;
  padding: 16px;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.05);
}
select, input, button {
  padding: 10px 16px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 14px;
  transition: all 0.2s ease;
}
button {
  background: var(--primary);
  color: white;
  border: none;
  cursor: pointer;
  font-weight: 600;
  box-shadow: 0 2px 8px rgba(31,78,121,0.2);
}
button:hover { background: #163a5f; transform: translateY(-1px); }
button.secondary { background: var(--secondary); box-shadow: 0 2px 8px rgba(198,89,17,0.2); }
button.secondary:hover { background: #a84a0e; }
button.danger { background: #e74c3c; }
button.danger:hover { background: #c0392b; }
.card {
  background: var(--card);
  border-radius: 16px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  overflow: hidden;
  margin-bottom: 24px;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
th {
  background: var(--primary);
  color: white;
  padding: 14px 8px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 10;
  font-weight: 600;
}
td {
  padding: 10px 6px;
  border-bottom: 1px solid #eee;
  text-align: center;
  transition: background 0.15s;
}
tr:hover td { background: var(--hover); }
td.name { text-align: left; font-weight: 500; min-width: 150px; max-width: 180px; }
td.name input { font-size: 12px; width: 100%; }
input[type="number"], input[type="text"] {
  width: 100%;
  border: 1px solid #ddd;
  padding: 8px;
  border-radius: 6px;
  background: var(--input);
  text-align: center;
  font-size: 12px;
}
input.formula {
  background: var(--formula);
  border: none;
  font-weight: 600;
  color: #1a5f2a;
}
.totals {
  background: #1F4E79 !important;
  color: white;
  font-weight: bold;
}
.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 20px;
  margin-bottom: 24px;
}
.summary-card {
  background: white;
  padding: 22px;
  border-radius: 16px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  border-left: 6px solid var(--secondary);
  transition: transform 0.2s;
}
.summary-card:hover { transform: translateY(-2px); }
.summary-card h3 { margin: 0 0 10px; font-size: 16px; color: var(--primary); }
.summary-card .value { font-size: 26px; font-weight: 700; color: var(--secondary); }
.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  background: white;
  padding: 8px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  width: fit-content;
}
.tabs button {
  background: transparent;
  color: var(--primary);
  border: 2px solid transparent;
  box-shadow: none;
}
.tabs button.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}
.footer-note {
  text-align: center;
  color: #7f8c8d;
  font-size: 12px;
  margin-top: 30px;
  padding: 10px;
}
.search-box {
  padding: 10px 16px;
  border: 1px solid var(--border);
  border-radius: 10px;
  min-width: 200px;
  background: white;
}
@media (max-width: 768px) {
  body { padding: 10px; }
  .header { flex-direction: column; text-align: center; gap: 12px; padding: 20px; }
  .controls { flex-direction: column; align-items: stretch; }
  table { font-size: 10px; }
  th, td { padding: 6px 4px; }
}
</style>

<div class="header">
  <div>
    <h1>Maaş Programı</h1>
    <p></p>

<div class="tabs">

  <button onclick="showTab('arsiv')">Arşiv</button>
</div>

<!-- BORDRO -->
<div id="tab-bordro">
  <div class="controls">
    <label>Ay:</label>
    <select id="filterAy" onchange="loadMonth()">
      <option value="2026-10">Ekim 2026</option>
      <option value="2026-09">Eylül 2026</option>
      <option value="2026-08">Ağustos 2026</option>
      <option value="2026-07">Temmuz 2026</option>
    </select>
    <select id="filterSube" onchange="renderTable()">
      <option value="">Tüm Şubeler</option>
    </select>
    <input type="text" id="searchName" class="search-box" placeholder="İsim ara..." onkeypress="if(event.key==='Enter') renderTable()">
    <button onclick="renderTable()" class="secondary">Ara</button>
    <button onclick="addPerson()">+ Personel Ekle</button>
    <input type="file" id="importFile" accept=".xlsx,.xls,.csv,.pdf" style="display:none;" onchange="importPeople(this)">
    <button onclick="document.getElementById('importFile').click()" class="secondary">📄 Excel/PDF</button>
    <button onclick="syncDevamsizlik()" class="secondary">Devamsızlık Çek</button>
    <button onclick="syncCeza()" class="secondary">Ceza Çek</button>
    <button onclick="arsivle()" class="secondary">Arşivle & Yeni Ay</button>
    <button onclick="showTab('arsiv')" class="secondary">Arşiv</button>
    <span id="personCount" style="margin-left:auto; font-weight:600;"></span>
  </div>

  <div class="card" style="overflow-x:auto;">
    <table id="bordroTable">
      <thead>
        <tr>
          <th>SIRA</th>
          <th>AD SOYAD</th>
          <th>MAAŞ</th>
          <th>GÜN</th>
          <th>DEVAMSIZLIK</th>
          <th>AVANS</th>
          <th>CEZA</th>
          <th>BES</th>
          <th>HACİZ</th>
          <th>BORÇ</th>
          <th>TOPLAM KESİNTİ</th>
          <th>HAKEDİŞ</th>
          <th>TAŞIMA / SİL</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
      <tfoot>
        <tr class="totals" id="totalRow"></tr>
      </tfoot>
    </table>
  </div>
</div>

<!-- ÖZET -->
<div id="tab-ozet" style="display:none;">

  subeler: ['Cadde', 'Kadıköy', 'Çengelköy', 'Taksim Pide', 'Taksim Büfe'],
  aylar: {}
};

function getCurrentMonth() {
  return document.getElementById('filterAy')?.value || '2026-10';
}

function loadMonth() {
  const ay = getCurrentMonth();
  if (!data.aylar[ay]) {
    data.aylar[ay] = { personeller: [] };
    // İlk açılışta Cadde'yi doldur
    if (ay === '2026-10' && data.aylar[ay].personeller.length === 0) {
      data.aylar[ay].personeller = caddeInit.map(p => ({...p, sube: 'Cadde', id: Date.now() + Math.random()}));
    }
  }
  // Yeni şubeleri ve personelleri ekle
  const required = ['Cadde', 'Kadıköy', 'Çengelköy', 'Taksim Pide', 'Taksim Büfe'];
  required.forEach(s => {
    if (!data.subeler.includes(s)) data.subeler.push(s);
  });
  cengelInit.forEach(p => {
    if (!data.aylar[ay].personeller.find(x => x.ad === p.ad && x.sube === 'Çengelköy')) {
      data.aylar[ay].personeller.push({...p, sube: 'Çengelköy', id: Date.now() + Math.random()});
    }
  });
  kadikoyInit.forEach(p => {
    if (!data.aylar[ay].personeller.find(x => x.ad === p.ad && x.sube === 'Kadıköy')) {
      data.aylar[ay].personeller.push({...p, sube: 'Kadıköy', id: Date.now() + Math.random()});
    }
  });
  save();
  updateSubeSelect();
  renderTable();
  renderSubeList();
}

function load() {
  // Önce Firebase'den yükle
  db.ref("maas").once("value").then(snap => {
    const fbData = snap.val();
    if (fbData && fbData.aylar) {
      data = fbData;
      console.log("Firebase'den yüklendi");
    } else {
      // Firebase boşsa localStorage'dan yükle
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        data = JSON.parse(saved);
        console.log("localStorage'dan yüklendi");
      }
    }
    loadMonth();
  }).catch(e => {
    console.error("Firebase yükleme hatası:", e);
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) data = JSON.parse(saved);
    loadMonth();
  });
}

function calc(p) {
  const dev = Math.round((p.maas || 0) / 30 * (p.gun || 0));
  const toplam = dev + (p.avans||0) + (p.ceza||0) + (p.bes||0) + (p.haciz||0) + (p.borc||0);
  const hakedis = (p.maas || 0) - toplam;
  return {dev, toplam, hakedis};
}

function format(n) {
  return (n||0).toLocaleString('tr-TR') + ' ₺';
}

function normalize(str) {
  return (str || '').toLowerCase()
    .replace(/ı/g, 'i').replace(/ğ/g, 'g').replace(/ü/g, 'u')
    .replace(/ş/g, 's').replace(/ö/g, 'o').replace(/ç/g, 'c')
    .replace(/[^a-z0-9\s]/g, '').trim();
}

function isSimilar(name, query) {
  if (!query) return true;
  const n = normalize(name);
  const q = normalize(query);
  if (n.includes(q) || q.includes(n)) return true;

  // Kelime bazlı eşleşme
  const qWords = q.split(/\s+/).filter(Boolean);
  const nWords = n.split(/\s+/).filter(Boolean);
  if (qWords.every(qw => nWords.some(nw => nw.includes(qw) || qw.includes(nw) || nw.startsWith(qw.slice(0, 3))))) return true;

  // Basit karakter benzerliği (yanlış yazım toleransı)
  let matches = 0;
  const minLen = Math.min(n.length, q.length);
  for (let i = 0; i < minLen; i++) {
    if (n[i] === q[i]) matches++;
  }
  return (matches / Math.max(n.length, q.length)) >= 0.5;
}

function importPeople(input){
  const sube = document.getElementById('filterSube').value;
  if (!sube) {
    alert('Önce bir şube seçin');
    input.value = '';
    return;
  }
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const text = e.target.result;
    const lines = text.split(/\n/).map(s=>s.trim()).filter(Boolean);
    const ay = getCurrentMonth();
    const sube = document.getElementById('filterSube').value || data.subeler[0] || 'Cadde';
    let added = 0;
    lines.forEach(line=>{
      const parts = line.split(/[,;\t]/).map(s=>s.trim());
      const name = parts[0];
      const maas = parseInt(parts[1]) || 0;
      if(name && name.length>2 && !/^\d+$/.test(name)){
        if(!data.aylar[ay].personeller.find(p=>p.ad===name && p.sube===sube)){
          data.aylar[ay].personeller.push({id:Date.now()+Math.random(), sube, ad:name, maas, gun:0, avans:0, ceza:0, bes:0, haciz:0, borc:0});
          added++;
        }
      }
    });
    save();
    renderTable();
    alert(added + " kişi eklendi");
  };
  reader.readAsText(file);
}

function moveToPosition(id, newPos) {
  if (!newPos || newPos < 1) return;
  const ay = getCurrentMonth();
  const filter = document.getElementById('filterSube').value;
  let list = [...data.aylar[ay].personeller];
  if (filter) list = list.filter(p => p.sube === filter);

  const fromIdx = list.findIndex(p => p.id == id);
  if (fromIdx === -1) return;

  let toIdx = newPos - 1;
  if (toIdx >= list.length) toIdx = list.length - 1;
  if (toIdx < 0) toIdx = 0;
  if (fromIdx === toIdx) return;

  const [moved] = list.splice(fromIdx, 1);
  list.splice(toIdx, 0, moved);

  if (filter) {
    const others = data.aylar[ay].personeller.filter(p => p.sube !== filter);
    data.aylar[ay].personeller = [...others, ...list];
  } else {
    data.aylar[ay].personeller = list;
  }
  save();
  renderTable();
}

function syncDevamsizlik() {
  const sube = document.getElementById('filterSube').value;
  if (!sube) {
    alert('Önce bir şube seçin');
    return;
  }
  const ay = getCurrentMonth();
  db.ref("mesai/" + sube).once("value").then(snap => {
    const dataMesai = snap.val() || {};
    const list = dataMesai.devamsizlik || [];
    if (list.length === 0) {
      alert(sube + ' için devamsızlık kaydı yok.');
      return;
    }
    let updated = 0;
    list.forEach(d => {
      const p = data.aylar[ay].personeller.find(x => x.ad === d.kisi && x.sube === sube);
      if (p) {
        p.gun = d.gun || 0;
        updated++;
      }
    });
    save();
    renderTable();
    alert(sube + ' şubesinde ' + updated + ' kişinin devamsızlığı güncellendi');
  }).catch(e => alert('Hata: ' + e.message));
}

function arsivle() {
  const ay = getCurrentMonth();
  if (!data.aylar[ay]) return;
  if (!confirm(ay + ' ayını arşivleyip yeni ay başlatılsın mı?')) return;
  
  // Mark as archived
  data.aylar[ay].arsiv = true;
  
  // Create next month
  const [y, m] = ay.split('-').map(Number);
  const next = new Date(y, m, 1);
  const nextAy = next.getFullYear() + '-' + String(next.getMonth() + 1).padStart(2, '0');
  
  if (!data.aylar[nextAy]) {
    data.aylar[nextAy] = { 
      personeller: data.aylar[ay].personeller.map(p => ({...p, id: Date.now() + Math.random(), gun:0, avans:0, ceza:0, bes:0, haciz:0, borc:0}))
    };
  }
  
  // Update select
  const sel = document.getElementById('filterAy');
  if (!Array.from(sel.options).some(o => o.value === nextAy)) {
    const opt = document.createElement('option');
    opt.value = nextAy;
    opt.textContent = next.toLocaleDateString('tr-TR', {month:'long', year:'numeric'});
    sel.insertBefore(opt, sel.firstChild);
  }
  sel.value = nextAy;
  
  save();
  loadMonth();
  alert(ay + ' arşivlendi. Yeni ay: ' + nextAy);
}

  Promise.all([
    fetch(fontUrl).then(r => r.arrayBuffer()),
    fetch(fontBoldUrl).then(r => r.arrayBuffer())
  ]).then(([buf, bufBold]) => {
    const toBase64 = (buffer) => {
      const bytes = new Uint8Array(buffer);
      let binary = '';
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary);
    };
    generatePDF(toBase64(buf), toBase64(bufBold));

        (p.haciz || 0).toLocaleString("tr-TR"),
        (p.borc || 0).toLocaleString("tr-TR"),
        c.toplam.toLocaleString("tr-TR"),
        c.hakedis.toLocaleString("tr-TR")

        6: { halign: "right", cellWidth: 18 },
        7: { halign: "right", cellWidth: 18 },
        8: { halign: "right", cellWidth: 18 },
        9: { halign: "right", cellWidth: 18 },
        10: { halign: "right", cellWidth: 22 },
        11: { halign: "right", cellWidth: 22, fontStyle: "bold" }
      },
      margin: { left: 4, right: 4, top: 15, bottom: 8 }
    });
    
    const blob = doc.output('blob');
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
  }
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        data = JSON.parse(ev.target.result);
        save();
        updateSubeSelect();
        renderTable();
        alert('İçe aktarıldı!');
      } catch(err) { alert('Hatalı dosya'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

load();

function deletePerson(id) {
  if (!confirm("Bu kişiyi silmek istediğine emin misin?")) return;
  const ay = getCurrentMonth();
  if (data.aylar[ay]) {
    data.aylar[ay].personeller = data.aylar[ay].personeller.filter(p => p.id != id);
    save();
    renderTable();
  }
}
