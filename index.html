<!DOCTYPE html>
<html lang="tr">
<head>

<title>Maaş Programı v1</title>
<style>
:root {
  --primary: #1F4E79;
  --secondary: #C65911;
  --bg: #f0f2f5;
  --card: #ffffff;
  --input: #fffbf0;
  --formula: #e8f5e9;
  --border: #e0e0e0;
  --text: #2c3e50;
  --hover: #f8f9fa;
}
* { box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, #f0f2f5 0%, #e8eef5 100%);
  margin: 0;
  padding: 16px;
  color: var(--text);
  min-height: 100vh;
}
.header {
  background: linear-gradient(135deg, var(--primary) 0%, #2a6cb0 100%);
  color: white;
  padding: 24px 32px;
  border-radius: 16px;
  margin-bottom: 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 4px 20px rgba(31,78,121,0.15);
}
.header h1 { margin: 0; font-size: 26px; font-weight: 700; }
.header p { margin: 6px 0 0; opacity: 0.9; font-size: 14px; }
.controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 20px;
  align-items: center;
  background: white;
  padding: 16px;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.05);
}
select, input, button {
  padding: 10px 16px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 14px;
  transition: all 0.2s ease;
}
button {
  background: var(--primary);
  color: white;
  border: none;
  cursor: pointer;
  font-weight: 600;
  box-shadow: 0 2px 8px rgba(31,78,121,0.2);
}
button:hover { background: #163a5f; transform: translateY(-1px); }
button.secondary { background: var(--secondary); box-shadow: 0 2px 8px rgba(198,89,17,0.2); }
button.secondary:hover { background: #a84a0e; }
button.danger { background: #e74c3c; }
button.danger:hover { background: #c0392b; }
.card {
  background: var(--card);
  border-radius: 16px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  overflow: hidden;
  margin-bottom: 24px;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
th {
  background: var(--primary);
  color: white;
  padding: 14px 8px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 10;
  font-weight: 600;
}
td {
  padding: 10px 6px;
  border-bottom: 1px solid #eee;
  text-align: center;
  transition: background 0.15s;
}
tr:hover td { background: var(--hover); }
td.name { text-align: left; font-weight: 500; min-width: 150px; max-width: 180px; }
td.name input { font-size: 12px; width: 100%; }
input[type="number"], input[type="text"] {
  width: 100%;
  border: 1px solid #ddd;
  padding: 8px;
  border-radius: 6px;
  background: var(--input);
  text-align: center;
  font-size: 12px;
}
input.formula {
  background: var(--formula);
  border: none;
  font-weight: 600;
  color: #1a5f2a;
}
.totals {
  background: #1F4E79 !important;
  color: white;
  font-weight: bold;
}
.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 20px;
  margin-bottom: 24px;
}
.summary-card {
  background: white;
  padding: 22px;
  border-radius: 16px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  border-left: 6px solid var(--secondary);
  transition: transform 0.2s;
}
.summary-card:hover { transform: translateY(-2px); }
.summary-card h3 { margin: 0 0 10px; font-size: 16px; color: var(--primary); }
.summary-card .value { font-size: 26px; font-weight: 700; color: var(--secondary); }
.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  background: white;
  padding: 8px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  width: fit-content;
}
.tabs button {
  background: transparent;
  color: var(--primary);
  border: 2px solid transparent;
  box-shadow: none;
}
.tabs button.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}
.footer-note {
  text-align: center;
  color: #7f8c8d;
  font-size: 12px;
  margin-top: 30px;
  padding: 10px;
}
.search-box {
  padding: 10px 16px;
  border: 1px solid var(--border);
  border-radius: 10px;
  min-width: 200px;
  background: white;
}
@media (max-width: 768px) {
  body { padding: 8px; }
  .header { flex-direction: column; text-align: center; gap: 10px; padding: 16px; }
  .controls { flex-direction: column; align-items: stretch; gap: 8px; }
  .card { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { font-size: 11px; min-width: 900px; }
  th, td { padding: 8px 5px; white-space: nowrap; }
  #bordroTable { min-width: 1100px; }
  input[type="number"], input[type="text"] { font-size: 11px; padding: 6px 4px; }
  .summary-grid { grid-template-columns: 1fr; }
}

/* Sütun genişlikleri - isim geniş, diğerleri eşit */
#bordroTable { table-layout: fixed; width: 100%; }
#bordroTable th, #bordroTable td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#bordroTable th:nth-child(1), #bordroTable td:nth-child(1) { width: 5%; }
#bordroTable th:nth-child(2), #bordroTable td:nth-child(2) { width: 18%; }
#bordroTable th:nth-child(n+3), #bordroTable td:nth-child(n+3) { width: 7.7%; }
#bordroTable input { width: 100%; box-sizing: border-box; max-width: 100%; }


/* Mobil Kart Görünümü */
@media (max-width: 768px) {
  .controls, #filterSube, #searchName { display: flex !important; visibility: visible !important; }
  .desktop-table { display: none; }
  .mobile-cards { display: block !important; }
  .person-card {
    background: white;
    border-radius: 12px;
    margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    overflow: hidden;
  }
  .card-header {
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    background: #f8f9fa;
    font-weight: 600;
  }
  .card-header .name { font-size: 15px; }
  .card-header .hakedis { color: #1F4E79; font-weight: 700; }
  .card-body {
    display: none;
    padding: 12px 16px;
    border-top: 1px solid #eee;
  }
  .card-body.open { display: block; }
  .card-row { display: flex; justify-content: space-between; margin: 6px 0; font-size: 14px; }
  .card-row label { color: #666; }
  .card-actions { margin-top: 10px; display: flex; gap: 8px; }
}
@media (min-width: 769px) {
  .mobile-cards { display: none; }
}

let data = {
  subeler: ['Cadde', 'Kadıköy', 'Çengelköy', 'Taksim Pide', 'Taksim Büfe'],
  aylar: {}
};

function getCurrentMonth() {
  // Düzenleme her zaman "current" üzerinde çalışır
  return "current";
}

function loadMonth() {
  const ay = getCurrentMonth();
  if (!data.aylar) data.aylar = {};
  if (!data.aylar.current) data.aylar.current = { personeller: [] };
  if (!data.aylar.current.personeller) data.aylar.current.personeller = [];

  // Maaş yoksa arşivden geri yükle (sadece bir kere, save yok)
  const hasSalary = data.aylar.current.personeller.some(p => (p.maas||0) > 0);
  if (!hasSalary && data.arsivler && data.arsivler["Ekim 2026"] && data.arsivler["Ekim 2026"].personeller) {
    data.aylar.current.personeller = JSON.parse(JSON.stringify(data.arsivler["Ekim 2026"].personeller));
    console.log("Arşivden maaşlı veri geri yüklendi");
  }

  // Yanlış şubeyi temizle
  if (data.subeler) {
    data.subeler = data.subeler.filter(s => s !== "Çengelöy");
    if (!data.subeler.includes("Çengelköy")) data.subeler.push("Çengelköy");
  }

  // Yeni şubeleri ekle (sadece eksikse)
  const required = ['Cadde', 'Kadıköy', 'Çengelköy', 'Taksim Pide', 'Taksim Büfe'];
  required.forEach(s => {
    if (!data.subeler.includes(s)) data.subeler.push(s);
  });

  updateSubeSelect();
  renderTable();
  renderSubeList();
}

let isInitialLoad = true;
let ignoreNextRealtime = false;

function load() {
  db.ref("maas").on("value", snap => {
    const fbData = snap.val();
    if (fbData && fbData.aylar) {
      const ay = getCurrentMonth();
      const remoteCount = fbData.aylar[ay]?.personeller?.length || 0;
      const localCount = data.aylar[ay]?.personeller?.length || 0;
      // Sadece başlangıçta veya remote daha fazla veri varsa al (kaybolmayı önle)
      if (isInitialLoad || remoteCount > 0) {
        data = fbData;
        console.log("Firebase anlık güncellendi, kişi sayısı:", remoteCount);
      } else {
        console.log("Yerel veri korundu");
      }
    } else if (isInitialLoad) {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        data = JSON.parse(saved);
        console.log("localStorage'dan yüklendi");
      }
    }
    isInitialLoad = false;
    if (ignoreNextRealtime) {
      ignoreNextRealtime = false;
      return; // kendi kaydettiğimiz değişikliği yoksay
    }
    loadMonth(); // personelleri kontrol et ve eksikse ekle
    updateSubeSelect();
    renderTable();
    renderSubeList();
    console.log("Tablo render edildi, toplam kişi:", data.aylar?.current?.personeller?.length || 0);
  }, err => {
    console.error("Firebase dinleme hatası:", err);
    if (isInitialLoad) {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) data = JSON.parse(saved);
      loadMonth();
    }
  });
}

function calc(p) {
  const dev = Math.round((p.maas || 0) / 30 * (p.gun || 0));
  // BES negatif gelirse de kesinti olarak işle
  const besKesinti = Math.abs(p.bes || 0);
  const toplam = dev + (p.avans||0) + (p.ceza||0) + besKesinti + (p.haciz||0) + (p.borc||0);
  const hakedis = (p.maas || 0) - toplam;
  return {dev, toplam, hakedis};
}

function format(n) {
  return (n||0).toLocaleString('tr-TR') + ' ₺';
}

function normalize(str) {
  return (str || '').toLowerCase()
    .replace(/ı/g, 'i').replace(/ğ/g, 'g').replace(/ü/g, 'u')
    .replace(/ş/g, 's').replace(/ö/g, 'o').replace(/ç/g, 'c')
    .replace(/[^a-z0-9\s]/g, '').trim();
}

function isSimilar(name, query) {
  if (!query) return true;
  const n = normalize(name);
  const q = normalize(query);
  if (n.includes(q) || q.includes(n)) return true;

  // Kelime bazlı eşleşme
  const qWords = q.split(/\s+/).filter(Boolean);
  const nWords = n.split(/\s+/).filter(Boolean);
  if (qWords.every(qw => nWords.some(nw => nw.includes(qw) || qw.includes(nw) || nw.startsWith(qw.slice(0, 3))))) return true;

  // Basit karakter benzerliği (yanlış yazım toleransı)
  let matches = 0;
  const minLen = Math.min(n.length, q.length);
  for (let i = 0; i < minLen; i++) {
    if (n[i] === q[i]) matches++;
  }
  return (matches / Math.max(n.length, q.length)) >= 0.5;
}

  const ay = getCurrentMonth();

    console.warn("Kişi bulunamadı:", id);

  p[field] = value;
  ignoreNextRealtime = true;
  save();
  updateRowCalculations(id);

function importPeople(input){
  const sube = document.getElementById('filterSube').value;
  if (!sube) {
    alert('Önce bir şube seçin');
    input.value = '';
    return;
  }
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const text = e.target.result;
    const lines = text.split(/\n/).map(s=>s.trim()).filter(Boolean);
    const ay = getCurrentMonth();
    const sube = document.getElementById('filterSube').value || data.subeler[0] || 'Cadde';
    let added = 0;
    lines.forEach(line=>{
      const parts = line.split(/[,;\t]/).map(s=>s.trim());
      const name = parts[0];
      const maas = parseInt(parts[1]) || 0;
      if(name && name.length>2 && !/^\d+$/.test(name)){
        if(!data.aylar[ay].personeller.find(p=>p.ad===name && p.sube===sube)){
          data.aylar[ay].personeller.push({id:Date.now()+Math.random(), sube, ad:name, maas, gun:0, avans:0, ceza:0, bes:0, haciz:0, borc:0});
          added++;
        }
      }
    });
    save();
    renderTable();
    alert(added + " kişi eklendi");
  };
  reader.readAsText(file);
}

function moveToPosition(id, newPos) {
  if (!newPos || newPos < 1) return;
  const ay = getCurrentMonth();
  const filter = document.getElementById('filterSube').value;
  let list = [...data.aylar[ay].personeller];
  if (filter) list = list.filter(p => p.sube === filter);

  const fromIdx = list.findIndex(p => p.id == id);
  if (fromIdx === -1) return;

  let toIdx = newPos - 1;
  if (toIdx >= list.length) toIdx = list.length - 1;
  if (toIdx < 0) toIdx = 0;
  if (fromIdx === toIdx) return;

  const [moved] = list.splice(fromIdx, 1);
  list.splice(toIdx, 0, moved);

  if (filter) {
    const others = data.aylar[ay].personeller.filter(p => p.sube !== filter);
    data.aylar[ay].personeller = [...others, ...list];
  } else {
    data.aylar[ay].personeller = list;
  }
  save();
  renderTable();
}

function syncDevamsizlik() {
  const sube = document.getElementById('filterSube').value;
  if (!sube) {
    alert('Önce bir şube seçin');
    return;
  }
  const ay = getCurrentMonth();
  db.ref("mesai/" + sube).once("value").then(snap => {
    const mesai = snap.val() || {};
    const devamlar = mesai.devamsizlik || [];
    let updated = 0;

    data.aylar[ay].personeller.forEach(p => {
      if (p.sube !== sube) return;
      const norm = normalize(p.ad);

      let toplamGun = 0;
      devamlar.forEach(d => {
        if (normalize(d.kisi) === norm || isSimilar(d.kisi, p.ad)) {
          toplamGun += Number(d.gun) || 0;
        }
      });

      if (toplamGun && p.gun !== toplamGun) {
        p.gun = toplamGun;
        updated++;
      }
    });

    save();
    renderTable();
    alert(updated + " kişinin devamsızlığı güncellendi");
  }).catch(e => alert("Devamsızlık çekilemedi: " + e.message));
}

        }
      });

      if (toplamCeza && p.ceza !== toplamCeza) {
        p.ceza = toplamCeza;
        updated++;
      }
    });

    save();
    renderTable();
    alert(updated + " kişinin cezası güncellendi");
  }).catch(e => alert("Ceza çekilemedi: " + e.message));
}

function arsivle() {
  const name = prompt("Bu arşivin adı ne olsun? (örnek: Ekim 2026)", "Ekim 2026");
  if (!name) return;
  if (!data.arsivler) data.arsivler = {};
  // Mevcut listeyi arşive kopyala
  data.arsivler[name] = JSON.parse(JSON.stringify(data.aylar.current || {personeller:[]}));
  // Gün/avans/ceza sıfırla, devam et
  if (data.aylar.current) {
    data.aylar.current.personeller.forEach(p => {
      p.gun = 0;
      p.avans = 0;
      p.ceza = 0;
    });
  }
  save();
  renderTable();
  alert(name + " arşivlendi. Kaldığın yerden devam edebilirsin.");
}

function showTab(tab) {
  ['bordro','ozet','arsiv','subeler'].forEach(t => {
    const el = document.getElementById('tab-' + t);
    if (el) el.style.display = t === tab ? 'block' : 'none';
  });
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  if (tab === 'arsiv') renderArsiv();
  if (tab === 'ozet') { renderSummary(); updateYearlySubeSelect(); renderYearly(); }
}

function renderSummary() {
  const grid = document.getElementById('summaryGrid');
  if (!grid) return;
  const ay = getCurrentMonth();
  const personeller = data.aylar[ay]?.personeller || [];
  const bySube = {};
  personeller.forEach(p => {
    if (!bySube[p.sube]) bySube[p.sube] = {count:0, maas:0, hakedis:0};
    bySube[p.sube].count++;
    bySube[p.sube].maas += p.maas||0;
    bySube[p.sube].hakedis += calc(p).hakedis;
  });
  grid.innerHTML = Object.keys(bySube).map(s => `
    <div class="summary-card">
      <h3>${s}</h3>
      <div class="value">${bySube[s].count} kişi</div>
      <div>Maaş: ${format(bySube[s].maas)}</div>
      <div>Hakediş: ${format(bySube[s].hakedis)}</div>
    </div>
  `).join('');
}

function renderArsiv() {
  const list = document.getElementById('arsivList');
  if (!list) return;
  const arsivler = data.arsivler || {};
  const names = Object.keys(arsivler).sort().reverse();
  list.innerHTML = names.map(name => {
    const pList = arsivler[name].personeller || [];
    let hak = 0;
    pList.forEach(p => hak += calc(p).hakedis);
    return `<div style="margin:10px 0;padding:12px;background:#f8f9fa;border-radius:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
      <div>
        <b>${name}</b> — ${pList.length} kişi — Hakediş: ${format(hak)}
      </div>
      <div>
        <button onclick="exportArsivPdf('${name}')" style="padding:6px 12px;">PDF İndir</button>
      </div>
    </div>`;
  }).join('') || '<p>Henüz arşiv yok.</p>';
}

let viewingArchive = null;

function exitArchive() {
  if (viewingArchive) {
    data.aylar.current = viewingArchive;
    viewingArchive = null;
  }
  const banner = document.getElementById('archiveBanner');
  if (banner) banner.style.display = 'none';

async function loadTurkishFont(doc){
  try{
    const res = await fetch("https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/fonts/Roboto/Roboto-Regular.ttf");
    if(!res.ok) return false;
    const buf = await res.arrayBuffer();
    const bytes = new Uint8Array(buf);
    let bin = "";
    for(let i=0; i<bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    const b64 = btoa(bin);
    doc.addFileToVFS("Roboto-Regular.ttf", b64);
    doc.addFont("Roboto-Regular.ttf", "Roboto", "normal");
    doc.setFont("Roboto");
    return true;
  }catch(e){ return false; }
}

async function exportArsivPdf(name) {
  const arsiv = data.arsivler?.[name];
  if (!arsiv) return alert('Arşiv bulunamadı');
  const list = arsiv.personeller || [];
  if (!list.length) return alert('Arşiv boş');

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation: 'landscape', unit: 'mm', format: 'a4'});
  await loadTurkishFont(doc);

  const now = new Date().toLocaleString("tr-TR", {day:"2-digit", month:"long", year:"numeric"});
  doc.setFillColor(11,18,32);
  doc.rect(0,0,297,12,"F");
  doc.setFontSize(12); doc.setTextColor(255,255,255);
  doc.text(name, 10, 8);
  doc.setFontSize(8);
  doc.text(now, 287, 8, {align:"right"});

  const body = list.map((p, i) => {
    const c = calc(p);
    return [
      i+1, p.ad||'', 
      (p.maas||0).toLocaleString('tr-TR'), p.gun||0,
      c.dev.toLocaleString('tr-TR'), (p.avans||0).toLocaleString('tr-TR'),
      (p.ceza||0).toLocaleString('tr-TR'), (p.bes||0).toLocaleString('tr-TR'),
      (p.haciz||0).toLocaleString('tr-TR'), (p.borc||0).toLocaleString('tr-TR'),
      c.toplam.toLocaleString('tr-TR'), c.hakedis.toLocaleString('tr-TR')
    ];
  });

  let sumMaas=0, sumDev=0, sumAv=0, sumCeza=0, sumBes=0, sumHaciz=0, sumBorc=0, sumTop=0, sumHak=0;
  list.forEach(p => {
    const c = calc(p);
    sumMaas += p.maas||0; sumDev += c.dev; sumAv += p.avans||0;
    sumCeza += p.ceza||0; sumBes += p.bes||0; sumHaciz += p.haciz||0;
    sumBorc += p.borc||0; sumTop += c.toplam; sumHak += c.hakedis;
  });

  doc.autoTable({
    startY: 16,
    head: [['Sıra','Ad Soyad','Maaş','Gün','Devamsızlık','Avans','Ceza','BES','Haciz','Borç','Toplam','Hakediş']],
    body: body,
    foot: [['','TOPLAM', sumMaas.toLocaleString('tr-TR'), '', sumDev.toLocaleString('tr-TR'), sumAv.toLocaleString('tr-TR'), sumCeza.toLocaleString('tr-TR'), sumBes.toLocaleString('tr-TR'), sumHaciz.toLocaleString('tr-TR'), sumBorc.toLocaleString('tr-TR'), sumTop.toLocaleString('tr-TR'), sumHak.toLocaleString('tr-TR')]],
    theme: "grid",
    styles: {font:"Roboto", fontSize:6.5, cellPadding:0.8, halign:"center", textColor:[20,20,20]},
    headStyles: {fillColor:[31,78,121], textColor:255, fontStyle:"bold"},
    footStyles: {fillColor:[34,34,34], textColor:255, fontStyle:"bold"},
    columnStyles: {1:{halign:"left"}},
    margin: {left:6, right:6}
  });
  doc.save(name + '.pdf');
}

function renderSubeList() {
  const ul = document.getElementById('subeList');

  ul.innerHTML = data.subeler.map(s => `<li>${s} <button class="danger" onclick="deleteSube('${s}')" style="padding:2px 8px;font-size:12px;">Sil</button></li>`).join('');

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        data = JSON.parse(ev.target.result);
        save();
        updateSubeSelect();
        renderTable();
        alert('İçe aktarıldı!');
      } catch(err) { alert('Hatalı dosya'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

    data.aylar[ay].personeller = data.aylar[ay].personeller.filter(p => p.id != id);

  }
}

let yearlyChart = null;

function renderYearly() {
  const sube = document.getElementById('yearlySube')?.value;
  const year = document.getElementById('yearlyYear')?.value || '2026';
  if (!sube) {
    document.getElementById('yearlySummary').textContent = 'Şube seçin';
    document.getElementById('yearlyTable').innerHTML = '';
    if (yearlyChart) yearlyChart.destroy();
    return;
  }

  const months = ['01','02','03','04','05','06','07','08','09','10','11','12'];
  const monthNames = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  const dataPoints = [];

  months.forEach((m, i) => {
    let list = [];
    const arsivler = data.arsivler || {};
    for (const name in arsivler) {
      const n = name.toLowerCase();
      const s = sube.toLowerCase();
      // Sadece seçilen yıla ait arşivleri al
      if (!n.includes(year)) continue;
      if (n.includes(s) || n.includes(s.slice(0,5))) {
        list = arsivler[name].personeller || [];
        break;
      }
    }
    // Current = Kasım (11)
    if (year === '2026' && m === '11' && data.aylar?.current) {
      const cur = data.aylar.current.personeller.filter(p => p.sube === sube);
      if (cur.length) list = cur;
    }
    // Ekim (10) — aylar["2026-10"] veya arşivden
    if (year === '2026' && m === '10') {
      let ekim = data.aylar?.["2026-10"]?.personeller || [];
      if (!ekim.length && data.arsivler?.["Ekim 2026"]?.personeller) {
        ekim = data.arsivler["Ekim 2026"].personeller;
      }
      const filtered = ekim.filter(p => p.sube === sube);
      if (filtered.length) list = filtered;
    }
    const maas = list.reduce((s,p) => s + (p.maas||0), 0);
    const hak = list.reduce((s,p) => s + calc(p).hakedis, 0);
    dataPoints.push({ month: monthNames[i], maas, hak, count: list.length });
  });

  const totalMaas = dataPoints.reduce((s,d) => s + d.maas, 0);
  const totalHak = dataPoints.reduce((s,d) => s + d.hak, 0);

  document.getElementById('yearlySummary').innerHTML = `
    <div style="display:flex; gap:16px; flex-wrap:wrap; margin-bottom:20px;">
      <div style="flex:1; min-width:180px; background:linear-gradient(135deg,#667eea,#764ba2); color:white; padding:18px; border-radius:16px; box-shadow:0 8px 24px rgba(102,126,234,0.3);">
        <div style="font-size:13px; opacity:0.9;">Toplam Maaş</div>
        <div style="font-size:26px; font-weight:700; margin-top:4px;">${format(totalMaas)}</div>
      </div>
      <div style="flex:1; min-width:180px; background:linear-gradient(135deg,#f093fb,#f5576c); color:white; padding:18px; border-radius:16px; box-shadow:0 8px 24px rgba(245,87,108,0.3);">
        <div style="font-size:13px; opacity:0.9;">Toplam Hakediş</div>
        <div style="font-size:26px; font-weight:700; margin-top:4px;">${format(totalHak)}</div>
      </div>
      <div style="flex:1; min-width:180px; background:linear-gradient(135deg,#4facfe,#00f2fe); color:white; padding:18px; border-radius:16px; box-shadow:0 8px 24px rgba(79,172,254,0.3);">
        <div style="font-size:13px; opacity:0.9;">${sube} • ${year}</div>
        <div style="font-size:18px; font-weight:600; margin-top:4px;">Yıllık Özet</div>
      </div>
    </div>`;

  const ctx = document.getElementById('yearlyChart');
  if (yearlyChart) yearlyChart.destroy();
  yearlyChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: dataPoints.map(d => d.month),
      datasets: [
        {
          label: 'Hakediş',
          data: dataPoints.map(d => d.hak),
          backgroundColor: dataPoints.map(d => d.hak > 0 
            ? 'rgba(102,126,234,0.85)' 
            : 'rgba(220,220,220,0.5)'),
          borderRadius: 10,
          borderSkipped: false,
          barPercentage: 0.7
        },
        {
          label: 'Maaş',
          data: dataPoints.map(d => d.maas),
          backgroundColor: dataPoints.map(d => d.maas > 0 
            ? 'rgba(245,87,108,0.55)' 
            : 'rgba(220,220,220,0.3)'),
          borderRadius: 10,
          borderSkipped: false,
          barPercentage: 0.7
        }
      ]
    },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      plugins: { 
        legend: { position: 'top', labels: { font: { size: 13, weight: '600' }, usePointStyle: true } },
        tooltip: { 
          backgroundColor: '#1F4E79',
          callbacks: { label: ctx => ctx.dataset.label + ': ' + format(ctx.raw) }
        }
      },
      scales: { 
        y: { 
          beginAtZero: true, 
          ticks: { callback: v => (v/1000).toFixed(0)+'K ₺', font: { size: 11 } },
          grid: { color: 'rgba(0,0,0,0.05)' }
        },
        x: { grid: { display: false }, ticks: { font: { size: 12, weight: '500' } } }
      }
    }
  });

  let rows = dataPoints.map((d,i) => 
    `<tr style="background:${i%2===0?'#fafbff':'white'};">
      <td style="text-align:left;padding:10px 12px;font-weight:600;">${d.month}</td>
      <td style="padding:10px;">${d.count || '-'}</td>
      <td style="padding:10px;color:#f5576c;font-weight:600;">${d.maas ? format(d.maas) : '-'}</td>
      <td style="padding:10px;color:#667eea;font-weight:700;">${d.hak ? format(d.hak) : '-'}</td>
    </tr>`
  ).join('');
  rows += `<tr style="background:#1F4E79;color:white;font-weight:700;">
    <td style="text-align:left;padding:12px;">TOPLAM</td>
    <td style="padding:12px;"></td>
    <td style="padding:12px;">${format(totalMaas)}</td>
    <td style="padding:12px;">${format(totalHak)}</td>
  </tr>`;
  document.getElementById('yearlyTable').innerHTML = `
    <table style="width:100%; font-size:13.5px; border-collapse:separate; border-spacing:0; border-radius:12px; overflow:hidden; box-shadow:0 4px 16px rgba(0,0,0,0.06);">
      <thead>
        <tr style="background:linear-gradient(90deg,#667eea,#764ba2); color:white;">
          <th style="text-align:left;padding:12px;">Ay</th>
          <th style="padding:12px;">Kişi</th>
          <th style="padding:12px;">Maaş</th>
          <th style="padding:12px;">Hakediş</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function updateYearlySubeSelect() {
  const sel = document.getElementById('yearlySube');
  if (!sel) return;
  const current = sel.value;
  sel.innerHTML = '<option value="">Şube seç</option>' + 
    (data.subeler || []).map(s => `<option>${s}</option>`).join('');
  sel.value = current;
}
